# Development configuration for the repository. The installable engine package lives in
# plugins/astrology-consultation/engine/ (its own pyproject.toml); the skill in plugins/astrology-consultation/skills/.

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness, not style: the codebase deliberately uses compact one-line forms.
select = ["F", "E9", "B006", "B008", "B023"]
