[project]
name = "astrology-consultation"
version = "3.5.0"
description = "Local Vedic astrology calculation engine and service (MCP, REST, CLI) for the astrology-consultation skill and Claude plugin"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["pyswisseph>=2.10", "pydantic>=2.7"]

# `uv sync --extra all --group dev` for everything; the core (calculation + CLI) needs only the two above.
[project.optional-dependencies]
mcp = ["mcp>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]
report = ["jinja2>=3.1", "weasyprint>=62"]
all = ["mcp>=2.2", "fastapi>=0.110", "uvicorn>=0.30", "jinja2>=3.1", "weasyprint>=62"]

[project.scripts]
astro = "astro.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astro"]
