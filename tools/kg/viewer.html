<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<script>try{if(localStorage.getItem('graph-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B4F9C'/%3E%3Cpath d='M6 6h20v20H6zM6 6l20 20M26 6 6 26M16 6l10 10-10 10L6 16z' fill='none' stroke='%23FFD23F' stroke-width='1.8'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#F6F8FA;--panel:#FFFFFF;--card:#FFFFFF;--line:#C5CFDA;--grid:#E3E9EF;--ink:#0E2238;--muted:#50647A;--subtle:#7D8FA3;
  --accent:#0B4F9C;--accentink:#FFFFFF;--focus:#0B4F9C;--hover:#EAF1F8;--sel:#FFE27A;--edge:#4A6585;--pkg:#6B7B8C;
  --k0:#B87E00;--k1:#1F6FD1;--k2:#1e8354;--k3:#6B4FC8;--k4:#C73A3A;--k5:#0E8F83;
  --ui:"Helvetica Neue","Segoe UI",Arial,sans-serif;
  --code:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0A2342;--panel:#0E2D54;--card:#12365F;--line:#2D5688;--grid:#102F57;--ink:#EAF3FF;--muted:#9DB9DA;--subtle:#6F93BC;
  --accent:#FFD23F;--accentink:#0A2342;--focus:#FFD23F;--hover:#1A416F;--sel:#2B5C94;--edge:#9DB9DA;--pkg:#86A2C4;
  --k0:#B88200;--k1:#3c8ced;--k2:#2F9E5E;--k3:#9272E6;--k4:#dd584e;--k5:#1F9E94;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit;border-radius:0}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);min-height:52px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none;width:24px;height:24px}
.brand>span{min-width:0;overflow:hidden}
.lg-bg{fill:var(--accent)}.lg-fg{stroke:var(--accentink)}
.brand b{font:600 14px/1.15 var(--code);display:block;white-space:nowrap}
.brand small{color:var(--muted);font:12px var(--code);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{display:flex;border:1px solid var(--ink);flex:none}
.switch[hidden]{display:none}
.switch a{padding:5px 12px;color:var(--ink);text-decoration:none;font:12.5px var(--code)}
.switch a[aria-current]{background:var(--ink);color:var(--bg)}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:32px;padding:0 34px 0 12px;background:var(--bg);border:1px solid var(--ink);font:13px var(--code)}
.search input::placeholder{color:var(--muted)}
.theme{flex:none;height:32px;padding:0 12px;border:1px solid var(--ink);background:var(--panel);font:12.5px var(--code)}
.theme:hover{background:var(--hover)}
.search kbd{position:absolute;right:8px;top:6px;font:12px var(--code);color:var(--muted);border:1px solid var(--line);padding:0 5px}
.results{position:absolute;z-index:30;top:38px;left:0;right:0;margin:0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--ink);max-height:min(420px,60vh);overflow:auto;box-shadow:0 8px 20px rgb(0 0 0/.2)}
.results[hidden]{display:none}
.results button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;padding:6px 8px}
.results li[aria-selected=true] button,.results button:hover{background:var(--hover)}
.results .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;font:12.5px var(--code)}
.results small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 40%;text-align:right}
.results .none{padding:10px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--kc,var(--pkg));flex:none;display:inline-block}
.trace-note{display:none;align-items:center;gap:8px;padding:6px 16px;background:var(--sel);border-bottom:1px solid var(--ink);font-size:13px}
.trace-note.on{display:flex}
.trace-note button{text-decoration:underline}
main{flex:1;display:grid;grid-template-columns:268px minmax(0,1fr) 340px;min-height:0}
#outline,#detail{background:var(--panel);overflow:auto;min-height:0}
#outline{border-right:1px solid var(--line);padding:10px 8px}
#detail{border-left:1px solid var(--line);padding:18px}
.ph{font:600 12px var(--code);margin:2px 8px 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:13px;border-left:1px solid var(--line);padding-left:5px}
.tree summary,.tree .leaf{display:flex;align-items:center;gap:6px;padding:3px 6px;cursor:pointer;width:100%;text-align:left;min-height:28px}
.tree summary{list-style:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"";flex:none;width:0;height:0;border-left:5px solid var(--muted);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree summary:hover,.tree .leaf:hover{background:var(--hover)}
.tree .here>summary,.tree .leaf.here{background:var(--sel);box-shadow:inset 3px 0 0 var(--ink)}
.tree .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font:12.5px var(--code)}
.tree .n{color:var(--muted);font-size:12px}
.tree .here>summary .n,.tree .leaf.here .n{color:var(--ink)}
.tree .cap{color:var(--muted);font-size:12px;padding:3px 6px}
#stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.strip{display:flex;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);padding-right:10px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;padding:8px 14px;font:12.5px var(--code);min-height:37px;flex:1}
.crumbs button{padding:1px 4px;color:var(--muted)}
.crumbs button:hover{background:var(--hover);color:var(--ink)}
.crumbs [aria-current]{color:var(--ink);font-weight:600}
.crumbs i{color:var(--subtle);font-style:normal}
.crumbs .hint{margin-left:auto;color:var(--muted);font:12px var(--ui)}
.zoom{display:flex;flex:none}
.zoom button{width:30px;height:26px;display:grid;place-items:center;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--ink)}
.zoom button+button{border-left:0}
.zoom button:hover{background:var(--hover)}
.cvwrap{flex:1;min-height:0;position:relative;overflow:hidden;
  background-image:linear-gradient(color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 1px),linear-gradient(var(--gmin,var(--grid)) 1px,transparent 1px),linear-gradient(90deg,var(--gmin,var(--grid)) 1px,transparent 1px);
  background-size:calc(100px*var(--gk,1)) calc(100px*var(--gk,1)),calc(100px*var(--gk,1)) calc(100px*var(--gk,1)),calc(20px*var(--gk,1)) calc(20px*var(--gk,1)),calc(20px*var(--gk,1)) calc(20px*var(--gk,1));
  background-position:var(--gx,0) var(--gy,0)}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#canvas.drag{cursor:grabbing}
#world.glide{transition:transform .15s ease-out}
.boot{position:absolute;inset:40% 10% auto;text-align:center;color:var(--muted);font:12.5px var(--code)}
.dock{display:flex;align-items:flex-end;gap:12px 24px;padding:8px 14px;border-top:1px solid var(--ink);background:var(--panel)}
.layers{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.grp{display:flex;align-items:flex-start;gap:8px}
.gl{font:600 12px var(--code);padding-top:3px;white-space:nowrap;min-width:96px}
.chips{display:flex;flex-wrap:wrap;gap:2px 8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 4px;font:12.5px var(--code);white-space:nowrap}
.chip::before{content:"";width:12px;height:12px;border:1.5px solid var(--ink);background:var(--ink);box-shadow:inset 0 0 0 2px var(--panel);flex:none}
.chip[aria-pressed=false]::before{background:none;box-shadow:none}
.chip[aria-pressed=false]{opacity:.6}
.chip:hover{background:var(--hover)}
.chip .n{color:var(--muted);font-size:12px}
.sw{width:10px;height:10px;background:var(--c);display:inline-block;flex:none}
.ln{width:18px;height:0;border-top:2px solid var(--edge);display:inline-block;flex:none}
.tblock{margin:0 12px;border:1.3px solid var(--ink);background:var(--card);display:flex;gap:16px;padding:3px 10px;font:11.5px/1.4 var(--code);flex:none}
.tblock .lg{display:flex;align-items:center;gap:7px;color:var(--ink);white-space:nowrap}
.tblock .lg svg{color:var(--edge)}
@media (max-width:1100px){.tblock{display:none}}
.empty{position:absolute;inset:40% 10% auto;text-align:center;color:var(--muted);pointer-events:none}
.edge{fill:none;stroke:var(--edge);stroke-width:1.3;opacity:.9;pointer-events:none}
.jn{fill:var(--edge);pointer-events:none}
.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.tile{cursor:pointer}
.tile:focus{outline:none}
.tile .box{fill:var(--card);stroke:var(--ink);stroke-width:1.3}
.tile .back{fill:var(--panel);stroke:var(--ink);stroke-width:1;stroke-opacity:.45}
.tile:hover .box{fill:var(--hover);stroke-width:2.2}
.tile:focus-visible .box{stroke:var(--focus);stroke-width:2.6}
.tile .t{fill:var(--ink);font:12.5px var(--code)}
.tile .s{fill:var(--muted);font:11.5px var(--code)}
.tile .chev{fill:none;stroke:var(--ink);stroke-width:1.6}
.tile.focus .box{stroke-width:2.2;fill:var(--sel)}
.tile.focus .t{font-weight:600}
.tile.focus .s{fill:var(--ink)}
.tile.more .box{fill:none;stroke-dasharray:4 3}
.tile.more .t{fill:var(--muted)}
.head{fill:var(--muted);font:600 12px var(--code)}
.conn{fill:var(--muted);font:12px var(--code)}
svg.lit .tile{opacity:.3}
svg.lit .edge,svg.lit .jn{opacity:.12}
svg.lit .tile.on{opacity:1}
svg.lit .edge.on,.edge.sel{opacity:1;stroke:var(--accent);stroke-width:2}
.tip{position:fixed;z-index:40;max-width:320px;padding:6px 9px;background:var(--ink);color:var(--bg);font:12px var(--code);pointer-events:none}
.tip[hidden]{display:none}
#detail h2{font:600 20px/1.25 var(--code);margin:6px 0 8px;overflow-wrap:anywhere}
#detail h3{font:600 12.5px var(--code);margin:18px 0 6px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4px}
#detail h3 span{color:var(--muted);font-weight:400}
#detail p{margin:0 0 10px;max-width:62ch;line-height:1.5}
.kindline{display:flex;align-items:center;gap:7px;color:var(--muted);font:12.5px var(--code)}
.path{display:flex;gap:8px;align-items:flex-start;font:12px/1.5 var(--code);color:var(--muted);overflow-wrap:anywhere;margin-bottom:10px}
.path button{flex:none;font:12px var(--ui);text-decoration:underline}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0;font-size:13px}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.defs{font:12px/1.7 var(--code);color:var(--muted);overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
.btn{padding:5px 12px;border:1px solid var(--ink);background:var(--panel);font:12.5px var(--code)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.9}
.rel{list-style:none;margin:0;padding:0}
.rel button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:4px 6px;min-height:30px}
.rel button:hover{background:var(--hover)}
.rel .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font:12.5px var(--code)}
.rel small{color:var(--muted);font-size:12px;flex:none}
.rel .pair{display:block;white-space:normal;overflow-wrap:anywhere}
.more-link{font-size:13px;text-decoration:underline;color:var(--muted);padding:4px 6px}
.close,.menu{display:none}
.scrim{display:none}
@media (max-width:900px){.brand small{display:none}}
@media (max-width:1180px){
  main{grid-template-columns:240px minmax(0,1fr)}
  #detail{position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(380px,92vw);transform:translateX(102%);transition:transform .18s ease-out;box-shadow:-8px 0 24px rgb(0 0 0/.25)}
  #detail.open{transform:none}
  .close{display:block;position:absolute;top:10px;right:12px;width:36px;height:36px;font-size:20px;color:var(--muted)}
}
@media (max-width:760px){
  .bar{flex-wrap:wrap;gap:8px 10px;padding:8px 12px}
  .menu{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--ink);flex:none}
  .brand{flex:1 1 60%}
  .theme{order:3;padding:0 8px}
  .switch{order:4;flex:0 0 100%}
  .switch a{flex:1;text-align:center;padding:6px 8px}
  .search{order:5;flex:0 0 100%;max-width:none}
  .search kbd{display:none}
  main{grid-template-columns:minmax(0,1fr)}
  #outline{position:fixed;z-index:20;top:0;left:0;bottom:0;width:min(320px,86vw);transform:translateX(-102%);transition:transform .18s ease-out;box-shadow:8px 0 24px rgb(0 0 0/.25)}
  #outline.open{transform:none}
  #detail{top:auto;left:0;right:0;width:auto;height:min(58vh,520px);border-left:0;border-top:1px solid var(--ink);transform:translateY(102%)}
  .scrim.on{display:block;position:fixed;inset:0;z-index:15;background:rgb(6 18 36/.45)}
  .crumbs .hint{display:none}
  .dock{flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:4px;padding:6px 12px}
  .layers{align-self:stretch;min-width:0}.grp{flex-direction:column;align-items:stretch;gap:2px;min-width:0}.gl{min-width:0}.chips{min-width:0}
  .tblock{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chip{flex:none;min-height:30px}
  .tree summary,.tree .leaf{min-height:36px}
  .rel button{min-height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  :root,:root[data-theme=dark]{color-scheme:light;--bg:#fff;--panel:#fff;--card:#fff;--line:#C5CFDA;--grid:#E3E9EF;--ink:#0E2238;--muted:#50647A;--subtle:#7D8FA3;--accent:#0B4F9C;--accentink:#fff;--hover:#EAF1F8;--sel:#FFE27A;--edge:#4A6585;--pkg:#6B7B8C;
    --k0:#B87E00;--k1:#1F6FD1;--k2:#1e8354;--k3:#6B4FC8;--k4:#C73A3A;--k5:#0E8F83}
  body{overflow:visible}.bar .search,.bar .menu,.theme,#outline,#detail,.zoom,.dock,.trace-note,.scrim,.boot{display:none!important}
  main{display:block;height:auto}#stage{display:block}.cvwrap{height:150mm}
}
</style>

<body>
<header class="bar">
  <button class="menu" id="menu" aria-label="Open outline"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 4h14M2 9h14M2 14h14"/></svg></button>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="lg-bg" width="32" height="32"/><path class="lg-fg" d="M6 6h20v20H6zM6 6l20 20M26 6 6 26M16 6l10 10-10 10L6 16z" fill="none" stroke-width="1.8"/></svg>
    <span><b id="title"></b><small id="subtitle"></small></span>
  </div>
  <nav class="switch" id="switch" aria-label="Choose a graph" hidden></nav>

  </div>

</header>
<div class="trace-note" id="traceNote"><span id="traceText"></span><button id="traceCancel">Cancel</button></div>
<main>
  <aside id="outline" aria-label="Outline"></aside>
  <section id="stage" aria-label="Diagram">
    <div class="strip"><nav class="crumbs" id="crumbs" aria-label="Location"></nav><div class="tblock" id="tblock" aria-label="Line patterns"></div><div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button><button id="zfit" aria-label="Fit to screen"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button></div></div>
    <div class="cvwrap" id="cvwrap"><svg id="canvas" role="group" aria-label="Relationship diagram"><defs>
      <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8z" fill="var(--edge)"/></marker>
    </defs><g id="world"><g id="edges"></g><g id="labels"></g><g id="tiles"></g></g></svg>
    <div class="empty" id="empty" hidden></div><div class="boot" id="boot">Building the diagram…</div></div>
    <div class="dock"><div class="layers"><div class="grp"><span class="gl">Relationships</span><div class="chips" id="relChips" role="group" aria-label="Relationships shown"></div></div><div class="grp"><span class="gl">Kinds</span><div class="chips" id="kindChips" role="group" aria-label="Kinds shown"></div></div></div></div>
  </section>
  <aside id="detail" aria-label="Details"></aside>
</main>
<div class="scrim" id="scrim"></div>
<div class="tip" id="tip" hidden></div>

<script>
'use strict';

const $=id=>document.getElementById(id);
const SVGNS='http://www.w3.org/2000/svg';
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){if(k==='on'){for(const ev in attrs.on)e.addEventListener(ev,attrs.on[ev])}else if(k==='class')e.className=attrs[k];else if(attrs[k]!=null&&attrs[k]!==false)e.setAttribute(k,attrs[k])}for(const c of kids)if(c!=null)e.append(c);return e}

const fmt=n=>n.toLocaleString('en-US');
const plural=(n,w)=>fmt(n)+' '+w+(n===1?'':'s');

// ---------- data ----------
const nodes=D.nodes.map(([id,label,kind,group,sub,detail],i)=>({i,id,label,kind,group,sub,detail}));
const groups=D.groups.map(([label,parent,key],i)=>({i,label,parent,key:key||'',kids:[],leaves:[],count:0,mix:{}}));
groups.forEach(g=>{if(g.parent>=0)groups[g.parent].kids.push(g.i)});
const kindIx=Object.fromEntries(D.kinds.map((k,i)=>[k.id,i]));
const kindSlot=Object.fromEntries(D.kinds.map((k,i)=>[k.id,k.slot==null?i:k.slot]));
const kindColor=k=>kindSlot[k]<0?'var(--pkg)':`var(--k${kindSlot[k]})`;
const relOn=D.rels.map(()=>true),kindOn=D.kinds.map(()=>true);
const relTotal=D.rels.map(()=>0),kindTotal=D.kinds.map(()=>0);
const out=nodes.map(()=>[]),inc=nodes.map(()=>[]);
for(let i=0;i<D.edges.length;i+=3){const[s,t,r]=[D.edges[i],D.edges[i+1],D.edges[i+2]];out[s].push(t,r);inc[t].push(s,r);relTotal[r]++}
for(const n of nodes){groups[n.group].leaves.push(n.i);kindTotal[kindIx[n.kind]]++;for(let g=n.group;g>=0;g=groups[g].parent){groups[g].count++;groups[g].mix[n.kind]=(groups[g].mix[n.kind]||0)+1}}
const nodeById=new Map(nodes.map(n=>[n.id,n])),groupByKey=new Map(groups.map(g=>[g.key,g]));
const pathOf=g=>{const p=[];for(let x=g;x>=0;x=groups[x].parent)p.unshift(x);return p};
const groupLabel=g=>pathOf(g).slice(1).map(x=>groups[x].label).join(' / ');
const unit=()=>D.title==='Project map'?'file':'item';
const nodeVisible=n=>kindOn[kindIx[nodes[n].kind]];

canvas.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e);moved=false;dragStart={x:e.clientX,y:e.clientY,kx:K.x,ky:K.y};if(pts.size===2){const[a,b]=[...pts.values()];pinch=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});
addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);
  if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),r=canvas.getBoundingClientRect();if(pinch)zoomAt(d/pinch,(a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top);pinch=d;moved=true;return}
  if(!dragStart)return;const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;if(!moved&&Math.hypot(dx,dy)<5)return;moved=true;canvas.classList.add('drag');setK(K.k,dragStart.kx+dx,dragStart.ky+dy,false)});
function endPtr(e){pts.delete(e.pointerId);if(pts.size<2)pinch=0;if(!pts.size){dragStart=null;canvas.classList.remove('drag');setTimeout(()=>{moved=false},0)}}
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();if(e.ctrlKey||e.metaKey)zoomAt(Math.exp(-e.deltaY*.01),e.clientX-r.left,e.clientY-r.top);else setK(K.k,K.x-e.deltaX,K.y-e.deltaY,false)},{passive:false});
function showTip(ev,t){const tip=$('tip');tip.textContent=t;tip.hidden=false;moveTip(ev)}
function moveTip(ev){const tip=$('tip'),w=tip.offsetWidth;tip.style.left=Math.min(ev.clientX+12,innerWidth-w-8)+'px';tip.style.top=(ev.clientY+14)+'px'}
function hideTip(){$('tip').hidden=true}

// ---------- crumbs, outline ----------
function renderCrumbs(){const c=$('crumbs');c.replaceChildren();const trail=view.t==='map'?pathOf(view.g):view.t==='node'?pathOf(nodes[view.n].group):[0];
  trail.forEach((g,i)=>{if(i)c.append(el('i',{'aria-hidden':'true'},'/'));const last=view.t==='map'&&i===trail.length-1;c.append(el('button',{'aria-current':last?'location':null,on:{click:()=>go({t:'map',g})}},groups[g].label))});
  if(view.t==='node'){c.append(el('i',{'aria-hidden':'true'},'/'),el('button',{'aria-current':'location'},nodes[view.n].label))}
  if(view.t==='path')c.append(el('i',{'aria-hidden':'true'},'/'),el('button',{'aria-current':'location'},`Path: ${nodes[view.a].label} to ${nodes[view.b].label}`));
  if(scopeHidden)c.append(el('span',{class:'hint'},`${fmt(scopeHidden)} more in search and the outline`))}
const treeNodes=new Map();
function buildTree(g){const li=el('li');if(groups[g].count===0)return null;const d=el('details',{}),s=el('summary',{},el('span',{class:'name',title:groups[g].label},groups[g].label),el('span',{class:'n'},fmt(groups[g].count)));d.append(s);treeNodes.set(g,d);s.addEventListener('click',e=>{if(!e.target.closest('.name'))return;e.preventDefault();d.open=true;go({t:'map',g});if(narrow())closeOutline()});
  d.addEventListener('toggle',()=>{if(d.open&&!d.dataset.ready){d.dataset.ready='1';const ul=el('ul',{role:'group'});for(const k of [...groups[g].kids].sort((a,b)=>groups[b].count-groups[a].count)){const c=buildTree(k);if(c)ul.append(c)}const ls=groups[g].leaves;for(const n of [...ls].sort((a,b)=>nodes[a].label.localeCompare(nodes[b].label)).slice(0,300))ul.append(el('li',{},el('button',{class:'leaf','data-n':n,on:{click:()=>{go({t:'node',n});if(narrow())closeOutline()}}},el('span',{class:'dot',style:`--kc:${kindColor(nodes[n].kind)}`}),el('span',{class:'name',title:nodes[n].label},nodes[n].label))));if(ls.length>300)ul.append(el('li',{class:'cap'},`${fmt(ls.length-300)} more: use search`));d.append(ul);syncOutline()}});li.append(d);return li}
const treeRoot=el('ul',{class:'tree',role:'tree'});for(const k of [...groups[0].kids].sort((a,b)=>groups[b].count-groups[a].count)){const c=buildTree(k);if(c)treeRoot.append(c)}$('outline').append(el('h2',{class:'ph'},'Outline'),treeRoot);
function syncOutline(){document.querySelectorAll('#outline .here').forEach(e=>e.classList.remove('here'));const g=view.t==='map'?view.g:view.t==='node'?nodes[view.n].group:0;for(const x of pathOf(g)){const d=treeNodes.get(x);if(d&&!d.open)d.open=true}const d=treeNodes.get(g);if(view.t==='map'&&d)d.classList.add('here');if(view.t==='node'){const b=document.querySelector(`#outline .leaf[data-n="${view.n}"]`);if(b){b.classList.add('here');b.scrollIntoView({block:'nearest'})}}}

// ---------- details ----------
function openDetail(){$('detail').classList.add('open');$('scrim').classList.toggle('on',narrow())}
function closeDetail(){$('detail').classList.remove('open');$('scrim').classList.remove('on')}
function closeOutline(){$('outline').classList.remove('open');$('scrim').classList.remove('on')}
$('menu').onclick=()=>{$('outline').classList.add('open');$('scrim').classList.add('on')};
$('scrim').onclick=()=>{closeOutline();closeDetail()};
const closeBtn=()=>el('button',{class:'close','aria-label':'Close details',on:{click:closeDetail}},'×');
function relList(title,count,ids,fn){const box=el('section',{});box.append(el('h3',{},title,el('span',{},fmt(count))));const ul=el('ul',{class:'rel'});const add=(from,to)=>{for(const x of ids.slice(from,to))ul.append(fn(x))};add(0,12);box.append(ul);if(ids.length>12){const b=el('button',{class:'more-link',on:{click:()=>{add(12,600);b.remove();if(ids.length>600)box.append(el('p',{class:'cap'},`${fmt(ids.length-600)} more: narrow with search`))}}},`Show all ${fmt(ids.length)}`);box.append(b)}return box}
const nodeRow=n=>el('li',{},el('button',{on:{click:()=>go({t:'node',n})}},el('span',{class:'dot',style:`--kc:${kindColor(nodes[n].kind)}`}),el('span',{class:'name',title:nodes[n].label},nodes[n].label),el('small',{},groups[nodes[n].group].label.slice(0,18))));
function renderDetail(){const p=$('detail');p.replaceChildren(closeBtn());
  if(selection){const e=selection;const[a,b]=[e.from,e.to];const pairs=[];const inA=keyMembers(a),inB=keyMembers(b);for(let i=0;i<D.edges.length&&pairs.length<800;i+=3){const s=D.edges[i],t=D.edges[i+1],r=D.edges[i+2];if(relOn[r]&&inA(s)&&inB(t))pairs.push([s,t,r])}
    p.append(el('div',{class:'kindline'},'Connection'),el('h2',{},`${itemName(a)} to ${itemName(b)}`),el('p',{},plural(e.w,'relationship')+': '+Object.entries(e.rels).map(([r,c])=>`${D.rels[r].label} ${fmt(c)}`).join(', ')));
    p.append(relList('Underlying links',pairs.length,pairs,([s,t,r])=>el('li',{},el('button',{on:{click:()=>go({t:'node',n:s})}},el('span',{class:'name pair'},`${nodes[s].label} ${D.rels[r].label} ${nodes[t].label}`)))));return}
  if(view.t==='node')return nodeDetail(p,view.n);
  if(view.t==='path'){p.append(el('div',{class:'kindline'},'Path'),el('h2',{},`${nodes[view.a].label} to ${nodes[view.b].label}`),el('p',{},'Shortest route using the relationships shown. Direction can change along the route.'));const c=bfs(view.a,view.b);if(c)p.append(relList('Steps',c.length,c.map(x=>x.n),nodeRow));return}
  groupDetail(p,view.g)}
function keyMembers(k){if(k[0]==='n'){const id=parseInt(k.slice(1));return n=>n===id}const g=parseInt(k.slice(1));const memo=new Map();return n=>{const gg=nodes[n].group;if(memo.has(gg))return memo.get(gg);let x=gg,hit=false;while(x>=0){if(x===g){hit=true;break}x=groups[x].parent}memo.set(gg,hit);return hit}}
function nodeDetail(p,n){const N=nodes[n],d=N.detail||{};const kind=D.kinds[kindIx[N.kind]].label;
  p.append(el('div',{class:'kindline'},el('span',{class:'dot',style:`--kc:${kindColor(N.kind)}`}),kind+(d.role?` (${d.role})`:'')),el('h2',{},N.label));
  if(d.path){const b=el('button',{on:{click:()=>{navigator.clipboard&&navigator.clipboard.writeText(d.path).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)})}}},'Copy');p.append(el('div',{class:'path'},el('span',{},d.path),b))}
  if(d.summary)p.append(el('p',{},d.summary));
  const facts=Object.entries(d).filter(([k])=>!['path','summary','defines','role'].includes(k));if(facts.length){const dl=el('dl',{});for(const[k,v]of facts)dl.append(el('dt',{},k.charAt(0).toUpperCase()+k.slice(1).replace(/_/g,' ')),el('dd',{},String(typeof v==='number'?fmt(v):v)));p.append(dl)}
  if(d.defines)p.append(el('h3',{},'Defines',el('span',{},fmt(d.defines.length))),el('div',{class:'defs'},d.defines.join('  ')));
  p.append(el('div',{class:'actions'},el('button',{class:'btn primary',on:{click:()=>startTrace(n)}},'Trace a path from here'),el('button',{class:'btn',on:{click:()=>go({t:'map',g:N.group})}},'Open folder')));
  const sec=(list,field)=>{const by=new Map();for(let i=0;i<list.length;i+=2){const r=list[i+1];if(!by.has(r))by.set(r,[]);by.get(r).push(list[i])}for(const[r,ids]of [...by.entries()].sort((a,b)=>a[0]-b[0])){const t=D.rels[r][field];p.append(relList(t.charAt(0).toUpperCase()+t.slice(1),ids.length,ids.sort((a,b)=>nodes[a].label.localeCompare(nodes[b].label)),nodeRow))}};sec(out[n],'label');sec(inc[n],'inverse')}
function groupDetail(p,g){const G=groups[g];
  p.append(el('div',{class:'kindline'},g?'Folder':'Overview'),el('h2',{},g?G.label:D.title));if(!g)p.append(el('p',{},D.note));
  const dl=el('dl',{});for(const k of D.kinds){const v=G.mix[k.id];if(v)dl.append(el('dt',{},k.label),el('dd',{},fmt(v)))}p.append(dl);
  if(!g)p.append(el('p',{},'Select a tile to follow it. Folders open in place, files show everything connected to them. Select a line to list the links it stands for.'));
  if(g){const inside=keyMembers('g'+g),count=new Map();const top=(x)=>{const pp=pathOf(nodes[x].group);return pp[1]};for(let i=0;i<D.edges.length;i+=3){const s=D.edges[i],t=D.edges[i+1],r=D.edges[i+2];if(!relOn[r])continue;const a=inside(s),b=inside(t);if(a===b)continue;const o=top(a?t:s);if(o==null)continue;const c=count.get(o)||{o:0,i:0};a?c.o++:c.i++;count.set(o,c)}
    const ids=[...count.entries()].sort((a,b)=>(b[1].o+b[1].i)-(a[1].o+a[1].i));if(ids.length)p.append(relList('Connected areas',ids.length,ids,([o,c])=>el('li',{},el('button',{on:{click:()=>go({t:'map',g:o})}},el('span',{class:'name'},groups[o].label),el('small',{},`${fmt(c.o)} out, ${fmt(c.i)} in`)))))}}

// ---------- filters ----------
function chips(host,cfg,on,totals,dot){host.replaceChildren();cfg.forEach((c,i)=>{if(!totals[i])return;const b=el('button',{class:'chip','aria-pressed':'true',on:{click:()=>{on[i]=!on[i];b.setAttribute('aria-pressed',on[i]);selection=null;render(false)}}},dot?el('span',{class:'sw',style:`--c:${kindColor(c.id)}`}):el('i',{class:'ln',style:`border-top-style:${c.dash?(c.dash==='2 4'?'dotted':'dashed'):'solid'}`}),c.label,el('span',{class:'n'},fmt(totals[i])));host.append(b)})}
chips($('relChips'),D.rels,relOn,relTotal,false);chips($('kindChips'),D.kinds,kindOn,kindTotal,true);

// ---------- search and trace ----------
const hay=nodes.map(n=>(n.label+' '+(n.detail&&n.detail.path||'')).toLowerCase());
const q=$('q'),list=$('results');let hits=[],cursor=-1;
function search(s){s=s.trim().toLowerCase();if(!s)return[];const scored=[];for(let i=0;i<hay.length;i++){const p=hay[i].indexOf(s);if(p<0)continue;scored.push([(p===0?0:hay[i][p-1]===' '||hay[i][p-1]==='/'?1:2)*1e4+hay[i].length,i])}groups.forEach((g,i)=>{if(i&&g.label.toLowerCase().includes(s))scored.push([g.label.toLowerCase().startsWith(s)?-1:9999,-i])});return scored.sort((a,b)=>a[0]-b[0]).slice(0,40).map(x=>x[1])}
function showResults(){list.replaceChildren();list.hidden=!q.value.trim();cursor=-1;if(list.hidden)return;if(!hits.length){list.append(el('li',{class:'none'},`No match for “${q.value.trim()}”. Try part of a name.`));return}hits.forEach((h,i)=>{const isG=h<0;const label=isG?groups[-h].label:nodes[h].label,where=isG?'Folder':groupLabel(nodes[h].group);list.append(el('li',{role:'option','data-i':i},el('button',{tabindex:-1,on:{click:()=>pick(h)}},el('span',{class:'dot',style:`--kc:${isG?'var(--pkg)':kindColor(nodes[h].kind)}`}),el('span',{class:'label',title:label},label),el('small',{},where))))})}
function pick(h){q.value='';hits=[];showResults();q.blur();if(h<0){if(tracing==null)go({t:'map',g:-h});return}if(tracing!=null)finishTrace(h);else go({t:'node',n:h})}
let timer;q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{hits=search(q.value);showResults()},70)});
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!hits.length)return;cursor=(cursor+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;[...list.children].forEach((li,i)=>li.setAttribute('aria-selected',i===cursor));list.children[cursor].scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){if(hits.length)pick(hits[Math.max(cursor,0)])}else if(e.key==='Escape'){q.value='';hits=[];showResults();q.blur()}});
addEventListener('click',e=>{if(!e.target.closest('.search')){list.hidden=true}});
addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);if(!typing&&(e.key==='/'||(e.key==='k'&&(e.metaKey||e.ctrlKey)))){e.preventDefault();q.focus()}else if(e.key==='k'&&(e.metaKey||e.ctrlKey)){e.preventDefault()}else if(e.key==='Escape'){if(tracing!=null)endTrace();closeDetail();closeOutline()}else if(!typing&&(e.key==='+'||e.key==='=')){$('zin').click()}else if(!typing&&e.key==='-'){$('zout').click()}else if(!typing&&e.key==='0'){fit2()}});
function startTrace(n){tracing=n;$('traceText').textContent=`Choose where the path from ${nodes[n].label} should end: search, or select a tile.`;$('traceNote').classList.add('on');closeDetail();q.focus()}
function endTrace(){tracing=null;$('traceNote').classList.remove('on')}
function finishTrace(b){const a=tracing;endTrace();if(a!==b)go({t:'path',a,b})}
$('traceCancel').onclick=endTrace;
{const root=document.documentElement,b=$('theme'),show=()=>{b.textContent=root.dataset.theme==='dark'?'Light':'Dark'};show();
 b.onclick=()=>{if(root.dataset.theme==='dark')delete root.dataset.theme;else root.dataset.theme='dark';show();try{localStorage.setItem('graph-theme',root.dataset.theme||'light')}catch(e){}}}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>render(true),120)});
matchMedia('print').addEventListener('change',()=>setTimeout(()=>render(true),30));   // refit the sheet when the page layout switches to print and back

view=fromHash();render(true);
if(window.innerWidth>1180||view.t!=='node')closeDetail();
$('boot').remove();
