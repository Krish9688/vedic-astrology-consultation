# Public checks of the product: secrets, privacy, plugin validation, lint and one install smoke test (synthetic chart).
# The full test suite runs in the private development repository before every export.
name: ci
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: read   # gitleaks-action lists a PR's commits on pull_request events
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generic privacy check (home paths, e-mails, blocked files; personal terms are checked locally before export)
        run: python3 tools/privacy_check.py
      - name: Plugin and marketplace validation (official validator)
        run: |
          npx -y @anthropic-ai/claude-code@2.1.288 plugin validate --strict .
          npx -y @anthropic-ai/claude-code@2.1.288 plugin validate --strict plugins/astrology-consultation
      - name: Lint
        run: uvx ruff@0.16.9 check .
      - name: Install smoke test (the plugin launcher builds the engine, serves MCP and computes a synthetic chart)
        run: |
          export CLAUDE_PLUGIN_ROOT="$PWD/plugins/astrology-consultation" CLAUDE_PLUGIN_DATA="$RUNNER_TEMP/plugin-data"
          plugins/astrology-consultation/scripts/astro doctor
          "$CLAUDE_PLUGIN_DATA/venv/bin/python" tools/mcp_smoke.py "$CLAUDE_PLUGIN_ROOT/scripts/astro"
