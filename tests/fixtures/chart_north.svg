<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-labelledby="ct cd" class="chart"><title id="ct">North Indian rasi chart</title><desc id="cd">Lagna Taurus. Aries: Su; Taurus: Mo, Ke; Leo: Ju; Scorpio: Ra; Capricorn: Ma, Sa; Aquarius: Ve; Pisces: Me.</desc><style>line,rect,path{stroke:#333;stroke-width:1.2;fill:none}.b{font-family:sans-serif;font-size:12px;fill:#111}.n{font-family:sans-serif;font-size:9px;fill:#777}.a{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#a33}</style><rect x="0" y="0" width="300" height="300"/><line x1="0" y1="0" x2="300" y2="300"/><line x1="300" y1="0" x2="0" y2="300"/><path d="M150.0 0L300 150.0L150.0 300L0 150.0Z"/><text x="150.0" y="51.0" class="n" text-anchor="middle">2</text><text x="150.0" y="79.0" class="a" text-anchor="middle">Asc Mo Ke</text><text x="75.0" y="14.0" class="n" text-anchor="middle">3</text><text x="30.0" y="59.0" class="n" text-anchor="middle">4</text><text x="75.0" y="126.0" class="n" text-anchor="middle">5</text><text x="75.0" y="154.0" class="b" text-anchor="middle">Ju</text><text x="30.0" y="209.0" class="n" text-anchor="middle">6</text><text x="75.0" y="254.0" class="n" text-anchor="middle">7</text><text x="150.0" y="201.0" class="n" text-anchor="middle">8</text><text x="150.0" y="229.0" class="b" text-anchor="middle">Ra</text><text x="225.0" y="254.0" class="n" text-anchor="middle">9</text><text x="270.0" y="209.0" class="n" text-anchor="middle">10</text><text x="270.0" y="229.0" class="b" text-anchor="middle">Ma Sa</text><text x="225.0" y="126.0" class="n" text-anchor="middle">11</text><text x="225.0" y="154.0" class="b" text-anchor="middle">Ve</text><text x="270.0" y="59.0" class="n" text-anchor="middle">12</text><text x="270.0" y="79.0" class="b" text-anchor="middle">Me</text><text x="225.0" y="14.0" class="n" text-anchor="middle">1</text><text x="225.0" y="34.0" class="b" text-anchor="middle">Su</text></svg>
